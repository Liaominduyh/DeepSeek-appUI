<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 28px;
    padding: 28px 40px;
    background: radial-gradient(ellipse at 30% 25%, #122a5e 0%, #0a1633 55%, #060d1f 100%);
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    user-select: none;
    color: #8fa8d8;
  }
  /* ================= 左栏：品牌区 ================= */
  .left {
    flex: 0 1 460px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-width: 0; min-height: 0;
  }
  .left > * { flex-shrink: 0; }
  .scene { position: relative; width: 360px; height: 300px; }
  .whale {
    position: absolute;
    left: 50%; top: 42%;
    width: 240px;
    transform: translate(-50%, -50%);
    animation: bob 3.2s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 40px rgba(77, 107, 254, 0.45));
  }
  @keyframes bob {
    from { transform: translate(-50%, -54%) rotate(-2deg); }
    to   { transform: translate(-50%, -46%) rotate(2deg); }
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0.08));
    border: 1px solid rgba(255,255,255,0.15);
    animation: rise 3.5s ease-in infinite;
    opacity: 0;
  }
  .b1 { width: 16px; height: 16px; left: 22%; bottom: 8%; }
  .b2 { width: 10px; height: 10px; left: 56%; bottom: 5%; animation-delay: 1.1s; }
  .b3 { width: 22px; height: 22px; left: 74%; bottom: 12%; animation-delay: 2s; }
  @keyframes rise {
    0%   { transform: translateY(0) scale(0.8); opacity: 0; }
    15%  { opacity: 0.9; }
    100% { transform: translateY(-300px) scale(1.15); opacity: 0; }
  }
  .title {
    margin-top: 4px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #7ea2ff, #4d6bfe, #7ea2ff);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 2.5s linear infinite;
  }
  @keyframes shimmer {
    from { background-position: 0% 0; }
    to   { background-position: 200% 0; }
  }
  .steps { display: flex; align-items: center; margin-top: 26px; gap: 8px; }
  .step {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: #5d7096; white-space: nowrap;
    transition: color .3s;
  }
  .step-dot {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid #3a4f76; background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #5d7096;
    transition: all .3s;
  }
  .step.active .step-dot {
    border-color: #4d6bfe; color: #e8efff;
    box-shadow: 0 0 14px rgba(77, 107, 254, 0.7);
    background: rgba(77, 107, 254, 0.25);
  }
  .step.active { color: #e8efff; }
  .step.done .step-dot {
    background: #4d6bfe; border-color: #4d6bfe; color: #0a1633; font-weight: 600;
  }
  .step.done { color: #7ea2ff; }
  .step-line { width: 26px; height: 2px; background: #2c3f63; }
  .step-line.done { background: #4d6bfe; }
  .step.skipped { opacity: 0.4; }
  .step.skipped .step-dot { border-color: #3a4f76; color: #5d7096; }
  .progress-wrap {
    width: 460px; max-width: 100%; margin-top: 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .progress-track {
    flex: 1; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.08); overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0%; border-radius: 3px;
    background: linear-gradient(90deg, #4d6bfe, #7ea2ff);
    transition: width .4s ease;
  }
  .progress-bar.indeterminate {
    width: 30%;
    animation: sweep 1.4s ease-in-out infinite alternate;
  }
  @keyframes sweep {
    from { margin-left: 0; }
    to   { margin-left: 70%; }
  }
  .progress-text {
    font-size: 13px; color: #7ea2ff; min-width: 150px; text-align: left;
  }
  .status {
    margin-top: 14px;
    max-width: 100%;
    font-size: 16px;
    color: #c3d4f7;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }
  .hint {
    margin-top: 16px;
    font-size: 12px; color: #5d7096; letter-spacing: 1px;
    opacity: 0.7;
  }
  /* ================= 右栏：日志面板 ================= */
  .right {
    flex: 1 1 auto; min-width: 360px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .log-panel {
    flex: 1;
    display: flex; flex-direction: column;
    min-height: 0;
    background: rgba(3, 8, 20, 0.6);
    border: 1px solid rgba(126, 162, 255, 0.16);
    border-radius: 12px;
    overflow: hidden;
  }
  .log-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    font-size: 13px; color: #7ea2ff; letter-spacing: 1px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(126,162,255,0.12);
    white-space: nowrap;
  }
  .log-items {
    flex: 1;
    min-height: 0;
    padding: 10px 14px;
    overflow-y: auto; overflow-x: auto;
    font-family: Consolas, "Courier New", "Microsoft YaHei UI", monospace;
    font-size: 12px; line-height: 1.75;
    white-space: pre;
    user-select: text; -webkit-user-select: text; cursor: text;
    background: radial-gradient(ellipse at 80% 10%, rgba(77,107,254,0.06) 0%, transparent 60%);
  }
  .log-items::-webkit-scrollbar { width: 8px; height: 8px; }
  .log-items::-webkit-scrollbar-thumb { background: #2c3f63; border-radius: 4px; }
  .log-items::-webkit-scrollbar-corner { background: transparent; }
  .log-hint {
    padding: 7px 14px;
    font-size: 11px; color: #5d7096; letter-spacing: 1px;
    border-top: 1px solid rgba(126,162,255,0.1);
  }
  body.error .status { color: #ff9d9d; }
  body.error .progress-bar { background: linear-gradient(90deg, #c24040, #ff7a7a); }
</style>
</head>
<body>
  <!-- ============ 左栏：品牌 + 状态 ============ -->
  <div class="left">
    <div class="scene">
      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
      <div class="bubble b3"></div>
      <!-- 官方 DeepSeek 鲸鱼 logo（开源项目通用版本，fill #4D6BFE） -->
      <svg class="whale" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <title>DeepSeek</title>
        <path fill="#4D6BFE" d="M23.748 4.482c-.254-.124-.364.113-.512.234-.051.039-.094.09-.137.136-.372.397-.806.657-1.373.626-.829-.046-1.537.214-2.163.848-.133-.782-.575-1.248-1.247-1.548-.352-.156-.708-.311-.955-.65-.172-.241-.219-.51-.305-.774-.055-.16-.11-.323-.293-.35-.2-.031-.278.136-.356.276-.313.572-.434 1.202-.422 1.84.027 1.436.633 2.58 1.838 3.393.137.093.172.187.129.323-.082.28-.18.552-.266.833-.055.179-.137.217-.329.14a5.526 5.526 0 01-1.736-1.18c-.857-.828-1.631-1.742-2.597-2.458a11.365 11.365 0 00-.689-.471c-.985-.957.13-1.743.388-1.836.27-.098.093-.432-.779-.428-.872.004-1.67.295-2.687.684a3.055 3.055 0 01-.465.137 9.597 9.597 0 00-2.883-.102c-1.885.21-3.39 1.102-4.497 2.623C.082 8.606-.231 10.684.152 12.85c.403 2.284 1.569 4.175 3.36 5.653 1.858 1.533 3.997 2.284 6.438 2.14 1.482-.085 3.133-.284 4.994-1.86.47.234.962.327 1.78.397.63.059 1.236-.03 1.705-.128.735-.156.684-.837.419-.961-2.155-1.004-1.682-.595-2.113-.926 1.096-1.296 2.746-2.642 3.392-7.003.05-.347.007-.565 0-.845-.004-.17.035-.237.23-.256a4.173 4.173 0 001.545-.475c1.396-.763 1.96-2.015 2.093-3.517.02-.23-.004-.467-.247-.588zM11.581 18c-2.089-1.642-3.102-2.183-3.52-2.16-.392.024-.321.471-.235.763.09.288.207.486.371.739.114.167.192.416-.113.603-.673.416-1.842-.14-1.897-.167-1.361-.802-2.5-1.86-3.301-3.307-.774-1.393-1.224-2.887-1.298-4.482-.02-.386.093-.522.477-.592a4.696 4.696 0 011.529-.039c2.132.312 3.946 1.265 5.468 2.774.868.86 1.525 1.887 2.202 2.891.72 1.066 1.494 2.082 2.48 2.914.348.292.625.514.891.677-.802.09-2.14.11-3.054-.614zm1-6.44a.306.306 0 01.415-.287.302.302 0 01.2.288.306.306 0 01-.31.307.303.303 0 01-.304-.308zm3.11 1.596c-.2.081-.399.151-.59.16a1.245 1.245 0 01-.798-.254c-.274-.23-.47-.358-.552-.758a1.73 1.73 0 01.016-.588c.07-.327-.008-.537-.239-.727-.187-.156-.426-.199-.688-.199a.559.559 0 01-.254-.078c-.11-.054-.2-.19-.114-.358.028-.054.16-.186.192-.21.356-.202.767-.136 1.146.016.352.144.618.408 1.001.782.391.451.462.576.685.914.176.265.336.537.445.848.067.195-.019.354-.25.452z"/>
      </svg>
    </div>
    <div class="title">DeepSeek Harness</div>

    <!-- 步骤指示器：0 检查 DSH / 1 安装依赖 / 2 启动服务 / 3 连接 -->
    <div class="steps">
      <div class="step" id="step0"><div class="step-dot">0</div>检查 DSH</div>
      <div class="step-line" id="line0"></div>
      <div class="step" id="step1"><div class="step-dot">1</div>安装依赖</div>
      <div class="step-line" id="line1"></div>
      <div class="step" id="step2"><div class="step-dot">2</div>启动服务</div>
      <div class="step-line" id="line2"></div>
      <div class="step" id="step3"><div class="step-dot">3</div>连接</div>
    </div>

    <!-- 进度条 -->
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-bar" id="bar"></div></div>
      <span class="progress-text" id="progressText">等待启动…</span>
    </div>

    <!-- 主状态 -->
    <div class="status" id="status">正在启动服务…</div>
    <div class="hint" id="hint">首次运行需下载依赖，通常需要几分钟，请勿关闭窗口</div>
  </div>

  <!-- ============ 右栏：日志面板 ============ -->
  <div class="right">
    <div class="log-panel">
      <div class="log-header">
        <span id="logTitle">运行日志</span>
      </div>
      <div class="log-items" id="logItems"></div>
      <div class="log-hint">日志可选中复制 · 向上滚动查看历史不会被拉回</div>
    </div>
  </div>

<script>
(function () {
  var MAX_LOG = 2000;
  var steps = [document.getElementById('step0'), document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3')];
  var lines = [document.getElementById('line0'), document.getElementById('line1'), document.getElementById('line2')];
  var logItems = document.getElementById('logItems');

  /** 按行前缀着色（npm warn 黄 / error 红 / http 蓝灰 / [dsh] 绿） */
  function colorOf(line) {
    if (line.indexOf('npm warn') === 0) return '#d9a94d';
    if (line.indexOf('npm error') === 0) return '#ff8a8a';
    if (line.indexOf('npm http') === 0) return '#6f8bc4';
    if (line.indexOf('[dsh]') === 0) return '#8ee6b0';
    return '#9db4e0';
  }

  window.dshUX = {
    /** 步骤高亮：stage 0-3；skip 数组声明被跳过的中间步骤（快启时跳过安装） */
    setStage: function (stage, label, skip) {
      skip = skip || [];
      for (var i = 0; i < steps.length; i++) {
        var cls = 'step';
        if (i === stage) cls += ' active';
        else if (i < stage) cls += (skip.indexOf(i) !== -1) ? ' skipped' : ' done';
        steps[i].className = cls;
      }
      for (var j = 0; j < lines.length; j++) {
        var nxt = j + 1;
        lines[j].className = 'step-line' + (nxt < stage && skip.indexOf(nxt) === -1 ? ' done' : '');
      }
      if (label) document.getElementById('status').textContent = label;
    },
    /** 日志面板标题（安装流程「依赖下载日志」/ 快启「运行日志」） */
    setLogTitle: function (title) {
      document.getElementById('logTitle').textContent = title;
    },
    /** 底部提示文案 */
    setHint: function (text) {
      document.getElementById('hint').textContent = text;
    },
    /** 进度条：mb 为已下载 MB 数；pct 传 null 时为不定态（总量未知） */
    setProgress: function (mb, pct) {
      var bar = document.getElementById('bar');
      var text = document.getElementById('progressText');
      if (pct != null) {
        bar.classList.remove('indeterminate');
        bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
        text.textContent = mb + ' MB';
      } else {
        bar.classList.add('indeterminate');
        text.textContent = '已下载 ' + mb + ' MB';
      }
    },
    /** 批量追加日志（最多 2000 行；用户上翻时不拉回，回到底部才跟随最新） */
    addLogs: function (batch) {
      var atBottom = logItems.scrollHeight - logItems.scrollTop - logItems.clientHeight < 24;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < batch.length; i++) {
        var div = document.createElement('div');
        div.textContent = batch[i];
        div.style.color = colorOf(batch[i]);
        frag.appendChild(div);
      }
      logItems.appendChild(frag);
      while (logItems.childNodes.length > MAX_LOG) logItems.removeChild(logItems.firstChild);
      if (atBottom) logItems.scrollTop = logItems.scrollHeight;
    },
    /** 错误态：红字提示，保留日志区 */
    setError: function (msg) {
      document.body.classList.add('error');
      document.getElementById('status').textContent = msg;
      document.getElementById('progressText').textContent = '启动失败';
    }
  };
})();
</script>
</body>
</html>
